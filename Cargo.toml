# src/Cargo.toml

[package]
name = "echat"
version = "0.1.0"
edition = "2024"

[dependencies]
#序列化与反序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

#axum基于tokio构建
tokio = { version = "1.46", features = ["full", "rt-multi-thread", "sync"] }

#日志依赖
tracing = "0.1"
tracing-subscriber = "0.3"

#数据库驱动
sqlx = { version = "0.7", features = ["mysql", "runtime-tokio", "tls-native-tls", "macros", "chrono"] }

#读取环境变量
dotenv = "0.15"

#跨域中间件
tower-http = { version = "0.5.0", features = ["cors"] }
http = "0.2"

#密码哈希
argon2 = "0.5.3"

#用户认证和授权
jsonwebtoken = "9.0"

#随机数
rand_core = { version = "0.6", features = ["std"] }

#添加chrono时间处理库
chrono = { version = "0.4", features = ["serde", "clock"] }

#异步原语
futures = "0.3"

#Rsa库
rsa = "0.9"

#BASE64编码库
base64 = "0.21"

#日志库
log = "0.4"

#日志实现
env_logger = "0.10"

#thiserror库：简化自定义错误类型定义
thiserror = "1.0"

#redis
redis = "0.23.0"

#连接池管理
bb8-redis = "0.9"

#分段锁
dashmap = "6.1"

#异步特征
async-trait = "0.1"

tower = {version = "0.4", features = ["util"]}

hyper = "0.14"

reqwest = { version = "0.11", features = ["json"] }

tokio-tungstenite = "0.20"

futures-util = "0.3"

#Axum框架
axum = { version = "0.8.4", features = ["ws", "macros"] }


